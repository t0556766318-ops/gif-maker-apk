<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>יוצר גיפים</title><meta name="theme-color" content="#1f2a44">
<style>
:root{--ink:#1f2a44;--bg:#eef1f6;--pk:#ff4f79;--tl:#0a8f89;--card:#fff}
@media(prefers-color-scheme:dark){:root{--ink:#e8ecf7;--bg:#141a2b;--card:#1f2740;--tl:#2fd0c8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Rubik,Heebo,"Segoe UI",system-ui,sans-serif}
header,main{max-width:760px;margin:auto;padding:16px}header{padding-bottom:0}
h1{font-size:2rem;margin:.2em 0;letter-spacing:-.02em}header p{margin:0;opacity:.75}
.drop{display:block;border:2px dashed var(--tl);border-radius:14px;padding:28px 12px;text-align:center;cursor:pointer;background:var(--card)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:22px 10px;margin:14px 0;border-radius:6px;background:radial-gradient(circle,var(--bg) 3px,transparent 3.5px) center top/16px 12px repeat-x,radial-gradient(circle,var(--bg) 3px,transparent 3.5px) center bottom/16px 12px repeat-x,#262b3d}
.strip:empty{display:none}
figure{margin:0;flex:0 0 128px;background:var(--card);border-radius:4px;padding:6px;display:grid;gap:4px}
figure img{width:100%;height:80px;object-fit:cover;border-radius:2px}
figure select{width:100%;font:inherit;font-size:.8rem}
small{min-height:1.2em;font-size:.72rem;opacity:.75}
figure div{display:flex;gap:4px}figure button{flex:1;padding:2px;border:0;border-radius:4px;background:var(--bg);color:var(--ink);cursor:pointer}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;background:var(--card);padding:14px;border-radius:12px}
.f{display:grid;gap:4px;font-size:.9rem}.f select{font:inherit}
.row{display:flex;align-items:center;gap:14px;margin:16px 0;flex-wrap:wrap}
#go{background:var(--pk);color:#fff;border:0;border-radius:999px;padding:12px 28px;font:inherit;font-weight:600;cursor:pointer}
#go:disabled{opacity:.5}progress{width:100%}
#out img{max-width:100%;border-radius:8px;display:block;margin:12px 0}
#dl{display:inline-block;background:var(--tl);color:#fff;padding:8px 20px;border-radius:999px;text-decoration:none;margin-inline-end:10px}
:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
</style></head><body>
<header><h1>יוצר גיפים</h1><p>עובד גם בלי אינטרנט. התמונות נשארות במכשיר.</p></header>
<main>
<label class="drop" id="drop">גררו תמונות לכאן או לחצו לבחירה<input type="file" id="f" accept="image/*" multiple hidden></label>
<div id="strip" class="strip"></div>
<section class="ctl" id="ctl">
<label class="f">רוחב בפיקסלים<select id="w"><option>240<option selected>320<option>480</select></label>
<label class="f">פריימים לכל תמונה: <b id="nv">8</b><input type="range" id="n" min="4" max="16" value="8"></label>
<label class="f">זמן לפריים: <b id="dv">80</b> מילישניות<input type="range" id="d" min="30" max="300" step="10" value="80"></label>
<label class="f">מספר צבעים (פחות צבעים = קובץ קטן)<select id="c"><option>16<option>32<option>64<option selected>128<option>256</select></label>
<label class="f">פילטר<select id="flt"><option value="none">ללא<option value="bw">שחור-לבן<option value="sepia">ספיה</select></label>
<label class="f">אפקט לכל התמונות<select id="all"></select></label>
<label><input type="checkbox" id="dith" checked> ריכוך מעברי צבע</label>
<label><input type="checkbox" id="loop" checked> חזרה בלולאה</label>
</section>
<div class="row"><button id="go">צור גיף</button><span id="est"></span></div>
<progress id="pr" hidden></progress>
<div id="out" hidden><img id="res" alt="הגיף שנוצר"><a id="dl" download="animation.gif">הורדת הגיף</a><span id="sz"></span></div>
</main>
<script>
const $=id=>document.getElementById(id),tick=()=>new Promise(r=>setTimeout(r)),FS=[[1,0,7/16],[-1,1,3/16],[0,1,5/16],[1,1,1/16]];
const EF={auto:'אוטומטי (חכם)',still:'ללא אפקט',zoomin:'זום פנימה',zoomout:'זום החוצה',pan:'גלישה',shake:'רעידה',pulse:'פעימה',rotate:'נדנוד',fade:'הופעה הדרגתית'};
let items=[];
$('all').innerHTML='<option value="">בחרו…</option>'+Object.entries(EF).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
const dims=()=>{const W=+$('w').value,b=items[0]&&items[0].bmp;return[W,b?Math.round(W*b.height/b.width)&~1:0]};
function est(){const[W,H]=dims(),n=items.length*$('n').value;$('est').textContent=n?`${n} פריימים, גודל משוער כ-${(n*W*H*.2/1e6).toFixed(1)}MB`:''}
function analyze(b){const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.drawImage(b,0,0,32,32);const d=x.getImageData(0,0,32,32).data;let L=0,Q=0,S=0;for(let i=0;i<d.length;i+=4){const l=.3*d[i]+.59*d[i+1]+.11*d[i+2];L+=l;Q+=l*l;S+=(Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2]))/255}L/=1024;Q=Math.sqrt(Math.max(0,Q/1024-L*L));S/=1024;const a=b.width/b.height;return L<70?'fade':a>1.6?'pan':S>.35?'pulse':Q>60?'zoomin':S<.12?'zoomout':'zoomin'}
async function add(fs){for(const f of fs){if(!f.type.startsWith('image/'))continue;try{const bmp=await createImageBitmap(f);items.push({bmp,url:URL.createObjectURL(f),ef:'auto',auto:analyze(bmp)})}catch(e){alert('לא ניתן לקרוא את הקובץ '+f.name)}}render();est()}
function render(){$('strip').innerHTML=items.map((it,i)=>`<figure><img src="${it.url}" alt=""><select data-i="${i}">${Object.entries(EF).map(([k,v])=>`<option value="${k}"${k==it.ef?' selected':''}>${v}</option>`).join('')}</select><small>${it.ef=='auto'?'נבחר: '+EF[it.auto]:''}</small><div><button data-m="${i},-1" title="הקדם">▶</button><button data-m="${i},1" title="אחר">◀</button><button data-m="${i},0" title="מחק">✕</button></div></figure>`).join('')}
$('f').onchange=e=>add(e.target.files);
$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();add(e.dataTransfer.files)};
$('strip').onclick=e=>{const m=e.target.dataset.m;if(!m)return;const[i,d]=m.split(',').map(Number);if(!d)items.splice(i,1);else{const j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]]}render();est()};
$('strip').onchange=e=>{items[e.target.dataset.i].ef=e.target.value;render()};
$('all').onchange=e=>{if(e.target.value){items.forEach(i=>i.ef=e.target.value);render()}};
$('ctl').oninput=()=>{$('nv').textContent=$('n').value;$('dv').textContent=$('d').value;est()};

function draw(x,b,e,t,W,H){x.globalAlpha=1;x.fillStyle='#000';x.fillRect(0,0,W,H);let s=Math.max(W/b.width,H/b.height),dx=0,dy=0,r=0,a=1;
if(e=='zoomin')s*=1+.25*t;else if(e=='zoomout')s*=1.25-.25*t;else if(e=='pan'){s*=1.3;dx=(.5-t)*(b.width*s-W)}else if(e=='shake'){s*=1.06;dx=Math.sin(t*25)*W*.02;dy=Math.cos(t*19)*H*.02}else if(e=='pulse')s*=1+.08*Math.sin(t*6.283);else if(e=='rotate'){s*=1.12;r=Math.sin(t*6.283)*.06}else if(e=='fade')a=Math.min(1,.1+t*1.4);
x.save();x.globalAlpha=a;x.translate(W/2+dx,H/2+dy);x.rotate(r);x.scale(s,s);x.drawImage(b,-b.width/2,-b.height/2);x.restore()}
function filt(d,t){for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];if(t=='bw')d[i]=d[i+1]=d[i+2]=.3*r+.59*g+.11*b;else{d[i]=.393*r+.769*g+.189*b;d[i+1]=.349*r+.686*g+.168*b;d[i+2]=.272*r+.534*g+.131*b}}}
function mcut(s,n){let B=[s];while(B.length<n){let bi=-1,bs=0,bc=0;B.forEach((b,i)=>{if(b.length<2)return;for(let ch=0;ch<3;ch++){let mn=255,mx=0;for(const p of b){if(p[ch]<mn)mn=p[ch];if(p[ch]>mx)mx=p[ch]}const sc=(mx-mn)*b.length;if(sc>bs){bs=sc;bi=i;bc=ch}}});if(bi<0)break;const b=B[bi].sort((p,q)=>p[bc]-q[bc]),m=b.length>>1;B.splice(bi,1,b.slice(0,m),b.slice(m))}
return B.map(b=>{const a=[0,0,0];for(const p of b){a[0]+=p[0];a[1]+=p[1];a[2]+=p[2]}return a.map(v=>Math.round(v/b.length))})}
function quant(d,W,H,P,dith,cache){const o=new Uint8Array(W*H),e=dith?new Float32Array(W*H*3):null;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,p=i*4;let r=d[p],g=d[p+1],b=d[p+2];
if(e){r=Math.min(255,Math.max(0,r+e[i*3]));g=Math.min(255,Math.max(0,g+e[i*3+1]));b=Math.min(255,Math.max(0,b+e[i*3+2]))}
const k=(r>>3)<<10|(g>>3)<<5|(b>>3);let j=cache.get(k);
if(j===undefined){let bd=1e9;for(let q=0;q<P.length;q++){const dr=P[q][0]-r,dg=P[q][1]-g,db=P[q][2]-b,dd=dr*dr+dg*dg+db*db;if(dd<bd){bd=dd;j=q}}cache.set(k,j)}
o[i]=j;
if(e){const er=r-P[j][0],eg=g-P[j][1],eb=b-P[j][2];for(const q of FS){const xx=x+q[0],yy=y+q[1];if(xx<0||xx>=W||yy>=H)continue;const t=(yy*W+xx)*3;e[t]+=er*q[2];e[t+1]+=eg*q[2];e[t+2]+=eb*q[2]}}}
return o}
function lzw(ix,mc){const clr=1<<mc,eoi=clr+1,out=[];let size=mc+1,next=eoi+1,dict=new Map(),cur=0,bits=0;
const emit=c=>{cur|=c<<bits;bits+=size;while(bits>=8){out.push(cur&255);cur>>=8;bits-=8}};
emit(clr);let p=ix[0];
for(let i=1;i<ix.length;i++){const k=ix[i],key=p*256+k,v=dict.get(key);
if(v!==undefined)p=v;else{emit(p);if(next===4096){emit(clr);dict.clear();size=mc+1;next=eoi+1}else{if(next>=(1<<size))size++;dict.set(key,next++)}p=k}}
emit(p);emit(eoi);if(bits>0)out.push(cur&255);return out}
function gif(idx,W,H,P,delay,loop,bits){const o=[],w=(...a)=>{for(const v of a)o.push(v)},w16=v=>w(v&255,v>>8),n=1<<bits;
w(0x47,0x49,0x46,0x38,0x39,0x61);w16(W);w16(H);w(0xf0|(bits-1),0,0);
for(let i=0;i<n;i++){const c=P[i]||[0,0,0];w(c[0],c[1],c[2])}
if(loop)w(0x21,0xff,11,...[...'NETSCAPE2.0'].map(c=>c.charCodeAt(0)),3,1,0,0,0);
const mc=Math.max(2,bits),dl=Math.round(delay/10);
for(const ix of idx){w(0x21,0xf9,4,4);w16(dl);w(0,0,0x2c);w16(0);w16(0);w16(W);w16(H);w(0,mc);const d=lzw(ix,mc);for(let i=0;i<d.length;i+=255){const m=Math.min(255,d.length-i);w(m);for(let j=0;j<m;j++)o.push(d[i+j])}w(0)}
w(0x3b);return new Blob([new Uint8Array(o)],{type:'image/gif'})}

$('go').onclick=async()=>{
if(!items.length)return alert('הוסיפו לפחות תמונה אחת');
const btn=$('go'),pr=$('pr'),[W,H]=dims(),F=+$('n').value,flt=$('flt').value;
btn.disabled=true;pr.hidden=false;pr.max=items.length*F*2;pr.value=0;$('out').hidden=true;
try{
const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true}),fr=[];
for(const it of items){const e=it.ef=='auto'?it.auto:it.ef;for(let i=0;i<F;i++){draw(x,it.bmp,e,F>1?i/(F-1):0,W,H);const im=x.getImageData(0,0,W,H);if(flt!='none')filt(im.data,flt);fr.push(im.data);pr.value++;if(i%2==0)await tick()}}
const px=W*H,tot=fr.length*px,st=Math.max(1,tot/20000|0),smp=[];
for(let k=0;k<tot;k+=st){const f=fr[(k/px)|0],p=(k%px)*4;smp.push([f[p],f[p+1],f[p+2]])}
const nc=+$('c').value,P=mcut(smp,nc),cache=new Map(),idx=[];
for(const d of fr){idx.push(quant(d,W,H,P,$('dith').checked,cache));pr.value++;await tick()}
const blob=gif(idx,W,H,P,+$('d').value,$('loop').checked,Math.log2(nc)),url=URL.createObjectURL(blob);
window._blob=blob;$('res').src=url;$('dl').href=url;$('sz').textContent=(blob.size/1e6).toFixed(2)+' MB';$('out').hidden=false;$('out').scrollIntoView({behavior:'smooth'});
}catch(err){alert('שגיאה ביצירת הגיף: '+err.message)}
btn.disabled=false;pr.hidden=true};
$('dl').onclick=e=>{if(window.AndroidBridge&&window._blob){e.preventDefault();const r=new FileReader();r.onload=()=>AndroidBridge.saveGif(r.result.split(',')[1]);r.readAsDataURL(window._blob)}};
</script></body></html>
