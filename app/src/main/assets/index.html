<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>גיף סטייל</title>
<style>

.tabs{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:5;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--card);box-shadow:0 -8px 28px #0003}

.tabs .on{background:var(--g);color:#fff}
main{max-width:760px;margin:auto;padding:16px 16px 100px}

small,.mut{color:var(--mut);font-size:.8rem;font-weight:400}

.sheet{max-height:90vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-width:760px;width:100%;margin:0 auto;display:grid;gap:12px}.sheet h2{margin:0}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px 4px;border:2px solid var(--ln);border-radius:14px;background:none;color:var(--ink);font:inherit;cursor:pointer}.seg .on{border-color:#7a5cff;background:#7a5cff22}

[hidden]{display:none!important}

.f input:not([type=range]):not([type=color]){font:inherit;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink)}
.two{display:flex;gap:8px}.two input[type=color]{width:48px;height:38px;border:0;padding:0;background:none}.sheet a{color:#7a5cff}

#lb{position:fixed;top:0;right:0;bottom:0;left:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:20}#lb img{max-width:96%;max-height:92%;border-radius:12px}.gi.sl{outline:3px solid #7a5cff}figure img{touch-action:pan-x}

<label><input type="checkbox" id="wm"> 🏷️ סימן מים (הלוגו) על הגיפים</label>

<button id="cls" class="ghost">✖️ סגירה</button><small class="mut" style="text-align:center">גרסה 5.0.0</small><small class="mut" style="text-align:center">© כל הזכויות שמורות לגיף סטייל<br><a href="mailto:alesgud613@gmail.com">alesgud613@gmail.com</a></small></div></div>
<script>
onerror=(m,u,l)=>{const e=document.getElementById('err');if(e){e.hidden=false;e.textContent='שגיאה: '+m+' (שורה '+l+')'}};
const $=id=>document.getElementById(id),tick=()=>new Promise(r=>setTimeout(r)),FS=[[1,0,7/16],[-1,1,3/16],[0,1,5/16],[1,1,1/16]];
const EF={auto:'🤖 אוטומטי (חכם)',still:'⏸️ ללא אפקט',zoomin:'🔍 זום פנימה',zoomout:'🔭 זום החוצה',pan:'↔️ גלישה',shake:'📳 רעידה',pulse:'💓 פעימה',rotate:'🎠 נדנוד',fade:'🌅 הופעה הדרגתית',assemble:'🧩 הרכבה מחלקים',shatter:'💥 התפוררות',slices:'🎞️ פרוסות',circle:'⭕ חלון עגול',heart:'💗 חלון לב',txtwin:'🔤 חלון בצורת כיתוב',cutmove:'✂️ חפץ נע (חיתוך ידני)'};
let items=[];
$('all').innerHTML='<option value="">בחרו…</option>'+Object.entries(EF).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
const dims=()=>{const W=Math.min(+$('w').value,$('sv').checked?240:999),b=items[0]&&items[0].bmp;return[W,b?(Math.round(W*($('ar').value=='a'?b.height/b.width:+$('ar').value))&~1):0]};
function est(){const[W,H]=dims(),n=items.reduce((a,it)=>a+(it.vf?it.vf.length:+$('n').value),0);$('est').textContent=n?`${n} פריימים, גודל משוער כ-${(n*W*H*.2/1e6).toFixed(1)}MB`:''}
function analyze(b){const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.drawImage(b,0,0,32,32);const d=x.getImageData(0,0,32,32).data;let L=0,Q=0,S=0;for(let i=0;i<d.length;i+=4){const l=.3*d[i]+.59*d[i+1]+.11*d[i+2];L+=l;Q+=l*l;S+=(Math.max(d[i],d[i+1],d[i+2])-Math.min(d[i],d[i+1],d[i+2]))/255}L/=1024;Q=Math.sqrt(Math.max(0,Q/1024-L*L));S/=1024;const a=b.width/b.height;return L<70?'fade':a>1.6?'pan':S>.35?'pulse':Q>60?'zoomin':S<.12?'zoomout':'zoomin'}
async function add(fs){for(const f of fs){if(!f.type.startsWith('image/'))continue;try{const bmp=await createImageBitmap(f);items.push({bmp,url:URL.createObjectURL(f),ef:'auto',auto:analyze(bmp)})}catch(e){alert('לא ניתן לקרוא את הקובץ '+f.name)}}render();est()}
function render(){$('strip').innerHTML=items.map((it,i)=>`<figure><img src="${it.url}" alt=""><select data-i="${i}">${Object.entries(EF).map(([k,v])=>`<option value="${k}"${k==it.ef?' selected':''}>${v}</option>`).join('')}</select><small>${it.ef=='auto'?'נבחר: '+EF[it.auto]:''}</small><div><button data-m="${i},-1" title="הקדם">▶</button><button data-m="${i},1" title="אחר">◀</button><button data-m="${i},0" title="מחק">✕</button>${it.vf?'':`<button data-c="${i}" title="חיתוך ידני">✂️</button>`}</div></figure>`).join('')}
$('f').onchange=e=>add(e.target.files);
$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();add(e.dataTransfer.files)};
$('strip').onclick=e=>{if(e.target.dataset.c!==undefined)return openCut(+e.target.dataset.c);const m=e.target.dataset.m;if(!m)return;const[i,d]=m.split(',').map(Number);if(!d)items.splice(i,1);else{const j=i+d;if(j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]]}render();est()};
$('strip').onchange=e=>{items[e.target.dataset.i].ef=e.target.value;render()};
$('all').onchange=e=>{if(e.target.value){items.forEach(i=>i.ef=e.target.value);render()}};
$('ctl').oninput=()=>{$('nv').textContent=$('n').value;$('dv').textContent=$('d').value;est()};

function draw(x,b,e,t,W,H){if(TL[e])return tiles(x,b,e,t,W,H);if(WN[e])return win(x,b,e,t,W,H);if(e=='cutmove'&&window.cI&&window.cI.cut)return cutfx(x,b,t,W,H);x.globalAlpha=1;x.fillStyle='#000';x.fillRect(0,0,W,H);let s=Math.max(W/b.width,H/b.height),dx=0,dy=0,r=0,a=1;
if(e=='zoomin')s*=1+.25*t;else if(e=='zoomout')s*=1.25-.25*t;else if(e=='pan'){s*=1.3;dx=(.5-t)*(b.width*s-W)}else if(e=='shake'){s*=1.06;dx=Math.sin(t*25)*W*.02;dy=Math.cos(t*19)*H*.02}else if(e=='pulse')s*=1+.08*Math.sin(t*6.283);else if(e=='rotate'){s*=1.12;r=Math.sin(t*6.283)*.06}else if(e=='fade')a=Math.min(1,.1+t*1.4);
x.save();x.globalAlpha=a;x.translate(W/2+dx,H/2+dy);x.rotate(r);x.scale(s,s);x.drawImage(b,-b.width/2,-b.height/2);x.restore()}
function filt(d,t,ph){const cs=Math.cos(ph*6.283),sn=Math.sin(ph*6.283);for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];if(t=='hue'){d[i]=r*(.213+cs*.787-sn*.213)+g*(.715-cs*.715-sn*.715)+b*(.072-cs*.072+sn*.928);d[i+1]=r*(.213-cs*.213+sn*.143)+g*(.715+cs*.285+sn*.14)+b*(.072-cs*.072-sn*.283);d[i+2]=r*(.213-cs*.213-sn*.787)+g*(.715-cs*.715+sn*.715)+b*(.072+cs*.928+sn*.072)}else if(t=='bw')d[i]=d[i+1]=d[i+2]=.3*r+.59*g+.11*b;else{d[i]=.393*r+.769*g+.189*b;d[i+1]=.349*r+.686*g+.168*b;d[i+2]=.272*r+.534*g+.131*b}}}
function mcut(s,n){let B=[s];while(B.length<n){let bi=-1,bs=0,bc=0;B.forEach((b,i)=>{if(b.length<2)return;for(let ch=0;ch<3;ch++){let mn=255,mx=0;for(const p of b){if(p[ch]<mn)mn=p[ch];if(p[ch]>mx)mx=p[ch]}const sc=(mx-mn)*b.length;if(sc>bs){bs=sc;bi=i;bc=ch}}});if(bi<0)break;const b=B[bi].sort((p,q)=>p[bc]-q[bc]),m=b.length>>1;B.splice(bi,1,b.slice(0,m),b.slice(m))}
return B.map(b=>{const a=[0,0,0];for(const p of b){a[0]+=p[0];a[1]+=p[1];a[2]+=p[2]}return a.map(v=>Math.round(v/b.length))})}
function quant(d,W,H,P,dith,cache){const o=new Uint8Array(W*H),e=dith?new Float32Array(W*H*3):null;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,p=i*4;let r=d[p],g=d[p+1],b=d[p+2];
if(e){r=Math.min(255,Math.max(0,r+e[i*3]));g=Math.min(255,Math.max(0,g+e[i*3+1]));b=Math.min(255,Math.max(0,b+e[i*3+2]))}
const k=(r>>3)<<10|(g>>3)<<5|(b>>3);let j=cache[k];
