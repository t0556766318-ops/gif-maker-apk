plugins {
    id 'com.android.application'
}
android {
    namespace 'com.gifmaker.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.gifmaker.app'
        minSdk 21
        targetSdk 34
        versionCode((project.findProperty('vCode') ?: '4').toInteger())
        versionName '5.0.0'
    }
    signingConfigs {
        release {
            if (System.getenv('KS_FILE')) {
                storeFile file(System.getenv('KS_FILE'))
                storeType 'pkcs12'
                storePassword System.getenv('KS_PASS')
                keyAlias 'gifstyle'
                keyPassword System.getenv('KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            signingConfig System.getenv('KS_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.core:core:1.12.0'
}
